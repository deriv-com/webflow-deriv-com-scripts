name: AE Sitemap Generation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate_ae_sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "24"

      - name: Generate rewritten sitemap + robots.txt
        shell: bash
        run: node .github/generate_ae_sitemap.js

      - name: Show output
        shell: bash
        run: |
          echo "----- output/ae/sitemap.xml -----"
          cat output/ae/sitemap.xml
          if [ -f output/ae/robots.txt ]; then
            echo "----- output/ae/robots.txt -----"
            cat output/ae/robots.txt
          fi

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ae-sitemap
          path: output/

      - name: Upload to R2
        uses: ./.github/actions/upload_to_r2
        with:
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_bucket_name: ${{ secrets.R2_BUCKET_NAME }}
